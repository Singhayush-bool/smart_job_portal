{% extends "accounts/base.html" %}

{% block title %}Reset Password - SmartJobs{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <div class="auth-header">
            <h2>🔑 Reset Password</h2>
            <p>Enter your registered email address to receive password recovery instructions.</p>
        </div>

        <form method="POST" class="auth-form">
            {% csrf_token %}
            
            <div class="form-wrapper">
                {{ form.as_p }}
            </div>

            <button type="submit" class="btn-primary">Send Reset Link</button>
        </form>

        <div class="auth-footer">
            <a href="{% url 'accounts:login' %}">← Back to Login</a>
        </div>
    </div>
</div>

<style>
    .auth-container { max-width: 420px; margin: 60px auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .auth-card { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }

    .auth-header { text-align: center; margin-bottom: 24px; }
    .auth-header h2 { font-size: 22px; font-weight: 700; margin: 0 0 6px 0; }
    .auth-header p { font-size: 13px; color: #666; margin: 0; line-height: 1.4; }

    .form-wrapper p { margin-bottom: 16px; }
    .form-wrapper label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-wrapper input { width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; }

    .btn-primary { width: 100%; background: #0a66c2; color: white; border: none; padding: 12px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; }
    .auth-footer a { color: #0a66c2; font-weight: 600; text-decoration: none; }
</style>
{% endblock %}
