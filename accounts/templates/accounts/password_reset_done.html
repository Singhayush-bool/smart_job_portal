{% extends "accounts/base.html" %}

{% block title %}Email Sent - SmartJobs{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card" style="text-align: center;">
        <div class="auth-header">
            <h2>✉️ Check Your Inbox</h2>
            <p>We've emailed you instructions for setting your password. If they haven't arrived in a few minutes, check your spam folder.</p>
        </div>
        <a href="{% url 'accounts:login' %}" class="btn-primary" style="display:inline-block; text-decoration:none;">Back to Login</a>
    </div>
</div>

<style>
    .auth-container { max-width: 420px; margin: 60px auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .auth-card { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .auth-header { text-align: center; margin-bottom: 24px; }
    .auth-header h2 { font-size: 22px; font-weight: 700; margin: 0 0 6px 0; }
    .auth-header p { font-size: 13px; color: #666; margin: 0; line-height: 1.4; }
    .btn-primary { width: 100%; background: #0a66c2; color: white; border: none; padding: 12px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; box-sizing: border-box; }
</style>
{% endblock %}
